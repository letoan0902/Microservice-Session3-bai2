# =============================================================================
# order-service-prod.yml
# Cấu hình riêng của order-service khi chạy profile "prod".
# Được nạp khi service gọi tới: GET /order-service/prod
# =============================================================================

spring:
  datasource:
    url: jdbc:mysql://foodx-cluster.local:3306/orders_db?useSSL=true&requireSSL=true&serverTimezone=Asia/Ho_Chi_Minh
    username: order_service_user
    password: "{cipher}AQBQcm9kT3JkZXJTZXJ2aWNlRGF0YWJhc2VQYXNzd29yZEVuY3J5cHRlZFNhbXBsZTAxMjM0NTY3ODlBQkNE"
    hikari:
      # order-service là điểm nghẽn ghi của hệ thống nên cần pool lớn nhất
      maximum-pool-size: 60
      minimum-idle: 15
      connection-timeout: 20000

  kafka:
    bootstrap-servers: kafka-1.foodx.local:9092,kafka-2.foodx.local:9092,kafka-3.foodx.local:9092
    properties:
      sasl.jaas.config: "{cipher}AQBQcm9kS2Fma2FTYXNsSmFhc0NvbmZpZ0VuY3J5cHRlZFNhbXBsZUZvb2RYQUJDREVGMDEyMzQ1Njc4OQ=="
    producer:
      acks: all
      retries: 5

foodx:
  order:
    timeout:
      connect-timeout-ms: 2000
      read-timeout-ms: 4000
      thanh-toan-timeout-giay: 300
      cho-nha-hang-phan-hoi-giay: 90
      cho-phep-huy-don-giay: 60

    feature:
      dat-don-hen-gio: true
      # Chưa mở cho khách hàng thật vì còn ảnh hưởng tới điều phối giao hàng
      gop-nhieu-nha-hang-mot-don: false
      tu-dong-ap-ma-giam-gia: true
      thanh-toan-khi-nhan-hang: true
      chia-hoa-don: false

    business:
      gia-tri-don-toi-thieu: 30000
      gia-tri-don-toi-da: 5000000
      so-mon-toi-da-moi-don: 50
      so-don-toi-da-moi-gio: 10
      phu-phi-cao-diem: 5000
      so-lan-thu-lai-phat-su-kien: 5
      so-ngay-luu-lich-su: 365

    integration:
      restaurant-service-url: http://restaurant-service
      delivery-service-url: http://delivery-service
      payment-gateway-url: https://pay.foodx.local/api/v1
      payment-gateway-key: "{cipher}AQBQcm9kUGF5bWVudEdhdGV3YXlBcGlLZXlFbmNyeXB0ZWRTYW1wbGVGb29kWDAxMjM0NTY3ODlBQkNERUY="

logging:
  level:
    com.foodx.order: INFO
