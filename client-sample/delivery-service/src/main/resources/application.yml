# =============================================================================
# client-sample/delivery-service/src/main/resources/application.yml
#
# Cấu hình phía service của delivery-service (Spring Boot 3.2.5).
# Chỉ khai báo danh tính service và nguồn cấu hình; mọi tham số nghiệp vụ
# đều nằm ở config-repo/delivery-service*.yml.
# =============================================================================

spring:
  application:
    # Khớp với tên file delivery-service.yml trong config-repo
    name: delivery-service

  config:
    import: "optional:configserver:http://localhost:8888"

  profiles:
    active: dev

  cloud:
    config:
      label: main
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
